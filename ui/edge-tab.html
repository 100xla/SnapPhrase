<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <title></title>
  <style>
    :root {
      --handle-bg: rgba(30, 41, 59, 0.74);
      --handle-border: rgba(59, 130, 246, 0.50);
      --handle-fg: #60a5fa;
      --handle-hover-bg: #2563eb;
      --handle-hover-border: #60a5fa;
      --handle-hover-fg: #ffffff;
      --handle-glow: rgba(37, 99, 235, 0.58);

      --edge-len: 64px;
      --edge-thick-idle: 7px;
      --edge-thick-hover: 18px;
      --edge-icon-size: 12px;

      --corner-idle: 23px;
      --corner-hover: 33px;
      --corner-icon-size: 11px;
      --corner-icon-offset: 4px;
    }

    html.light {
      --handle-bg: rgba(255, 255, 255, 0.90);
      --handle-border: rgba(37, 99, 235, 0.48);
      --handle-fg: #2563eb;
      --handle-hover-bg: #2563eb;
      --handle-hover-border: #93c5fd;
      --handle-hover-fg: #ffffff;
      --handle-glow: rgba(37, 99, 235, 0.44);
    }

    body.size-compact {
      --edge-len: 46px;
      --edge-thick-idle: 6px;
      --edge-thick-hover: 15px;
      --edge-icon-size: 10px;

      --corner-idle: 18px;
      --corner-hover: 26px;
      --corner-icon-size: 9px;
      --corner-icon-offset: 3px;
    }

    body.size-large {
      --edge-len: 82px;
      --edge-thick-idle: 9px;
      --edge-thick-hover: 22px;
      --edge-icon-size: 14px;

      --corner-idle: 30px;
      --corner-hover: 44px;
      --corner-icon-size: 13px;
      --corner-icon-offset: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    .drag-surface {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body.dragging,
    body.dragging * {
      cursor: grabbing !important;
    }

    /* ======================================================================
       4 Screen Edges (Left, Right, Top, Bottom)
       ====================================================================== */
    body.is-corner .edge-handle {
      display: none;
    }

    body.pos-left .drag-surface {
      justify-content: flex-start;
      align-items: center;
    }

    body.pos-right .drag-surface {
      justify-content: flex-end;
      align-items: center;
    }

    body.pos-top .drag-surface {
      justify-content: center;
      align-items: flex-start;
    }

    body.pos-bottom .drag-surface {
      justify-content: center;
      align-items: flex-end;
    }

    .edge-handle {
      background: var(--handle-bg);
      border: 1px solid var(--handle-border);
      color: var(--handle-fg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.56;
      backface-visibility: hidden;
      transform: translateZ(0);
      transition:
        width 0.14s cubic-bezier(0.16, 1, 0.3, 1),
        height 0.14s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.11s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.14s ease,
        background 0.14s ease,
        border-color 0.14s ease,
        box-shadow 0.14s ease;
    }

    body.pos-left .edge-handle,
    body.pos-right .edge-handle {
      width: var(--edge-thick-idle);
      height: var(--edge-len);
    }

    body.pos-top .edge-handle,
    body.pos-bottom .edge-handle {
      width: var(--edge-len);
      height: var(--edge-thick-idle);
    }

    body.pos-left .edge-handle {
      border-left: none;
      border-radius: 0 9px 9px 0;
    }

    body.pos-right .edge-handle {
      border-right: none;
      border-radius: 9px 0 0 9px;
    }

    body.pos-top .edge-handle {
      border-top: none;
      border-radius: 0 0 9px 9px;
    }

    body.pos-bottom .edge-handle {
      border-bottom: none;
      border-radius: 9px 9px 0 0;
    }

    .edge-icon {
      width: var(--edge-icon-size);
      height: var(--edge-icon-size);
      opacity: 0;
      transform: scale(0.75);
      transition: opacity 0.12s ease, transform 0.12s ease;
      pointer-events: none;
      flex-shrink: 0;
    }

    body.is-edge:hover .edge-handle,
    body.is-edge.hovered .edge-handle,
    body.is-edge.dragging .edge-handle {
      opacity: 1;
      background: var(--handle-hover-bg);
      border-color: var(--handle-hover-border);
      color: var(--handle-hover-fg);
      box-shadow: 0 0 12px var(--handle-glow);
    }

    body.pos-left:hover .edge-handle,
    body.pos-left.hovered .edge-handle,
    body.pos-left.dragging .edge-handle,
    body.pos-right:hover .edge-handle,
    body.pos-right.hovered .edge-handle,
    body.pos-right.dragging .edge-handle {
      width: var(--edge-thick-hover);
    }

    body.pos-top:hover .edge-handle,
    body.pos-top.hovered .edge-handle,
    body.pos-top.dragging .edge-handle,
    body.pos-bottom:hover .edge-handle,
    body.pos-bottom.hovered .edge-handle,
    body.pos-bottom.dragging .edge-handle {
      height: var(--edge-thick-hover);
    }

    body.is-edge:hover .edge-icon,
    body.is-edge.hovered .edge-icon,
    body.is-edge.dragging .edge-icon {
      opacity: 1;
      transform: scale(1);
    }

    /* ======================================================================
       4 Screen Corners — Right-Angled Triangle Wedge (◤ ◥ ◣ ◢)
       ====================================================================== */
    body.is-edge .corner-handle {
      display: none;
    }

    .corner-handle {
      position: absolute;
      width: var(--corner-idle);
      height: var(--corner-idle);
      opacity: 0.62;
      cursor: pointer;
      transition:
        width 0.15s cubic-bezier(0.16, 1, 0.3, 1),
        height 0.15s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.14s ease,
        filter 0.15s ease;
    }

    body.pos-top-left .corner-handle {
      top: 0;
      left: 0;
    }

    body.pos-top-right .corner-handle {
      top: 0;
      right: 0;
    }

    body.pos-bottom-left .corner-handle {
      bottom: 0;
      left: 0;
    }

    body.pos-bottom-right .corner-handle {
      bottom: 0;
      right: 0;
    }

    .corner-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    body.pos-top-right .corner-svg {
      transform: scaleX(-1);
    }

    body.pos-bottom-left .corner-svg {
      transform: scaleY(-1);
    }

    body.pos-bottom-right .corner-svg {
      transform: scale(-1, -1);
    }

    .corner-poly {
      fill: var(--handle-bg);
      transition: fill 0.14s ease;
    }

    .corner-diag {
      stroke: var(--handle-border);
      stroke-width: 1.5px;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
      transition: stroke 0.14s ease, stroke-width 0.14s ease;
    }

    .corner-icon {
      position: absolute;
      width: var(--corner-icon-size);
      height: var(--corner-icon-size);
      color: var(--handle-hover-fg);
      opacity: 0;
      transform: scale(0.72);
      transition: opacity 0.12s ease, transform 0.14s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    body.pos-top-left .corner-icon {
      top: var(--corner-icon-offset);
      left: var(--corner-icon-offset);
    }

    body.pos-top-right .corner-icon {
      top: var(--corner-icon-offset);
      right: var(--corner-icon-offset);
    }

    body.pos-bottom-left .corner-icon {
      bottom: var(--corner-icon-offset);
      left: var(--corner-icon-offset);
    }

    body.pos-bottom-right .corner-icon {
      bottom: var(--corner-icon-offset);
      right: var(--corner-icon-offset);
    }

    body.is-corner.hovered .corner-handle,
    body.is-corner.dragging .corner-handle {
      width: var(--corner-hover);
      height: var(--corner-hover);
      opacity: 1;
      filter: drop-shadow(0 0 6px var(--handle-glow));
    }

    body.is-corner.hovered .corner-poly,
    body.is-corner.dragging .corner-poly {
      fill: var(--handle-hover-bg);
    }

    body.is-corner.hovered .corner-diag,
    body.is-corner.dragging .corner-diag {
      stroke: var(--handle-hover-border);
      stroke-width: 1.8px;
    }

    body.is-edge.pressing:not(.dragging) .edge-handle {
      transform: scale(0.94) translateZ(0);
    }

    body.is-corner.hovered .corner-icon,
    body.is-corner.dragging .corner-icon {
      opacity: 1;
      transform: scale(1);
    }

    body.is-corner.pressing:not(.dragging) .corner-handle {
      transform: scale(0.93) translateZ(0);
    }
  </style>
</head>
<body class="pos-left is-edge size-standard" title="SatzTresor öffnen (Ziehen zum Verschieben • Rechtsklick für Menü)">
  <div id="dragSurface" class="drag-surface">
    <div id="edgeHandle" class="edge-handle">
      <svg class="edge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M13 7l-3 5h4l-3 5"/>
      </svg>
    </div>

    <div id="cornerHandle" class="corner-handle">
      <svg class="corner-svg" viewBox="0 0 36 36" preserveAspectRatio="none">
        <polygon class="corner-poly" points="0,0 36,0 0,36"></polygon>
        <line class="corner-diag" x1="36" y1="0" x2="0" y2="36"></line>
      </svg>
      <svg class="corner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M13 7l-3 5h4l-3 5"/>
      </svg>
    </div>
  </div>
  <script src="edge-tab.js"></script>
</body>
</html>
