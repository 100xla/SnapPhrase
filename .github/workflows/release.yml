name: Build & Release SatzTresor (Windows)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies cleanly
        run: npm ci

      - name: Build Windows Installer & Portable EXE
        run: npm run build:exe

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          Set-Location dist
          $files = Get-ChildItem -File -Filter "*.exe"
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $lines | Set-Content -Path "SHA256SUMS.txt" -Encoding UTF8
          Get-Content "SHA256SUMS.txt"

      - name: Upload Release Artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
